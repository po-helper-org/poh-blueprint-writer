# poh-blueprint: «Сервис Blueprint». Подключается строкой
#   include /etc/nginx/snippets/poh-blueprint.conf;
# внутри server{} корп-браузера — рядом с оболочкой отчётов /sprints/ (её меню ведёт сюда), за тем же гейтом.
#   /blueprint/        → 127.0.0.1:8662, статика интерфейса (данных нет)
#   /blueprint/login   → вход через гейт; после входа — «Вход выполнен» (интерфейс ловит её во фрейме)
#   /blueprint/api/    → API за гейтом; сервису — секрет гейта (без него 403)
#   /blueprint/mcp     → MCP «Система Blueprint»: без гейта, вход — личный Bearer-токен (mcp_tokens_file)
set $poh_blueprint_csp "frame-ancestors 'self' vector:; default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'none'";

location = /blueprint {
    return 301 /blueprint/;
}

location /blueprint/ {
    proxy_pass http://127.0.0.1:8662;
    proxy_set_header Host $host;
    add_header Referrer-Policy no-referrer always;
}

location = /blueprint/login {
    set $edge_gate_scope corp;
    set $edge_app blueprint;
    include /etc/nginx/snippets/poh-box/edge-auth.conf;
    proxy_pass http://127.0.0.1:8662/blueprint/login;
    proxy_set_header Host $host;
    add_header Content-Security-Policy $poh_blueprint_csp always;
}

location /blueprint/api/ {
    set $edge_gate_scope corp;
    set $edge_app blueprint;
    include /etc/nginx/snippets/poh-box/edge-auth-api.conf;
    proxy_pass http://127.0.0.1:8662;
    proxy_set_header Host $host;
    include /etc/nginx/snippets/corp-gate-secret.conf;
    proxy_read_timeout 660s;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;
}

location = /blueprint/mcp {
    limit_except POST GET DELETE { deny all; }
    proxy_pass http://127.0.0.1:8662;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Corp-Gate "";
    proxy_buffering off;
    proxy_read_timeout 660s;
    client_max_body_size 4m;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
