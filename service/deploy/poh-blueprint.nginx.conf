# poh-blueprint: «Сервис Blueprint» на корп-браузере, рядом с оболочкой отчётов /sprints/ (её меню ведёт сюда).
# Ставит root-агент poh-nginx-sync из main этого репозитория по записи в server-infra config/poh-nginx/snippets.conf
# (vhost корп-браузера, путь /blueprint, порт 8662): правка здесь доезжает до nginx сама, без sudo.
#   /blueprint/        список диаграмм и /blueprint/<эпик> — карта отдельной страницей; вход — редиректом на корп-вход
#   /blueprint/api/    API за входом (без сессии — 401, страница сама покажет вход)
#   /blueprint/mcp     MCP «Система Blueprint»: без корп-входа, свой Bearer-токен (mcp_tokens_file сервиса)
# Секрет гейта (corp-gate-secret.conf) получает только то, что прошло вход: без него сервис отвечает 403.

location = /blueprint {
    return 301 /blueprint/;
}

location /blueprint/ {
    auth_request /_edge_auth;
    error_page 401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $poh_edge_auth_cookie;
    proxy_pass http://127.0.0.1:8662;
    proxy_set_header Host $host;
    include /etc/nginx/snippets/corp-gate-secret.conf;
    add_header Referrer-Policy no-referrer always;
}

location /blueprint/api/ {
    auth_request /_edge_auth;
    proxy_pass http://127.0.0.1:8662;
    proxy_set_header Host $host;
    include /etc/nginx/snippets/corp-gate-secret.conf;
    proxy_read_timeout 660s;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;
}

location = /blueprint/mcp {
    proxy_pass http://127.0.0.1:8662;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Corp-Gate "";
    proxy_buffering off;
    proxy_read_timeout 660s;
    client_max_body_size 4m;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
