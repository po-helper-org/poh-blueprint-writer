<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Blueprint</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="blueprint.css">
</head>
<body>
<main id="app" class="bp-main">
  <header class="bp-head">
    <h1>Blueprint</h1>
    <button type="button" class="ds-btn ds-btn--primary" id="create">Создать</button>
  </header>
  <input class="ds-input" id="search" type="search" placeholder="Поиск" aria-label="Поиск">
  <div id="list"><p class="bp-empty">Загрузка…</p></div>
</main>

<section id="login" class="bp-login" hidden>
  <iframe id="loginFrame" title="Вход"></iframe>
</section>

<div class="bp-scrim" id="scrim" hidden></div>
<section class="bp-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="bp-sheet__head"><b id="sheetTitle">Новая диаграмма</b><button type="button" class="bp-x" id="sheetClose" aria-label="Закрыть">×</button></div>
  <div class="bp-sheet__body" id="sheetBody"></div>
</section>

<div id="toasts" class="bp-toasts" role="status" aria-live="polite"></div>
<script defer src="blueprint.js"></script>
</body>
</html>
