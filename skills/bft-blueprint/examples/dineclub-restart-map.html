было привязано к брони.","screens":["A1"],"big":""},{"persona":"rest","label":"Шаг 2 · Узнаю о скидке","title":"Гости знают о скидке заранее","text":"О нас рассказывают гостю сразу после покупки, в письме и в напоминаниях — он видит нас среди ближайших к площадке.","was":"О скидке узнавали меньше 1% гостей — до ресторанов почти никто не доходил.","screens":[],"big":""},{"persona":"rest","label":"Шаг 3 · В ресторане","title":"Гость показывает билет — сканируем","text":"Гость показывает билет — официант сканирует штрихкод.","was":"Отдельного приложения для официанта не было.","screens":["F2"],"big":""},{"persona":"rest","label":"Шаг 4 · В ресторане","title":"Приложение сразу даёт ответ","text":"Приложение сразу отвечает: скидка 10% или понятная причина отказа — без споров.","was":"","screens":["F3","F4"],"big":""},{"persona":"rest","label":"Шаг 5 · В ресторане","title":"Фотографируем чек — получаем компенсацию","text":"Официант фотографирует чек — компенсация ресторану зафиксирована.","was":"","screens":["F5"],"big":""},{"persona":"rest","label":"Шаг 6 · В ресторане","title":"Если что-то непонятно — помощь рядом","text":"Инструкция, частые вопросы и поддержка — в том же приложении.","was":"","screens":["F6"],"big":""},{"persona":"rest","label":"И с тех пор","title":"Больше гостей — и понятный способ их принять","text":"К нам приходят гости после спектаклей и концертов. Официант за одно сканирование понимает, давать ли скидку, а ресторан получает за неё компенсацию.","was":"","screens":[],"big":""}],"screens":{"A1":{"contour":"Приложение-сканер","view":"основной","img":"backlog/assets/screens/A1.svg"},"B1":{"contour":"Витрина","view":"основной","img":"backlog/assets/screens/B1.svg"},"C1":{"contour":"Email","view":"основной","img":"backlog/assets/screens/C1.svg"},"D1":{"contour":"Витрина","view":"основной","img":"backlog/assets/screens/D1.svg"},"D2":{"contour":"Витрина","view":"основной","img":"backlog/assets/screens/D2.svg"},"E1":{"contour":"Оповещение","view":"основной","img":"backlog/assets/screens/E1.svg"},"E2":{"contour":"Email или SMS","view":"основной","img":"backlog/assets/screens/E2.svg"},"F1":{"contour":"Электронный билет","view":"основной","img":"backlog/assets/screens/F1.svg"},"F2":{"contour":"Приложение-сканер","view":"основной","img":"backlog/assets/screens/F2.svg"},"F3":{"contour":"Приложение-сканер","view":"основной","img":"backlog/assets/screens/F3.svg"},"F4":{"contour":"Приложение-сканер","view":"альтернативный","img":"backlog/assets/screens/F4.svg"},"F5":{"contour":"Приложение-сканер","view":"основной","img":"backlog/assets/screens/F5.svg"},"F6":{"contour":"Приложение-сканер","view":"основной","img":"backlog/assets/screens/F6.svg"}},"notes":{"A1":"# Сканер — ресторан подключён\n\n![Подключён](backlog/assets/screens/A1.svg)\n\n## Product\n\n### Подключиться без сложностей\nКогда ресторан решил участвовать в акции, хочу **подключиться без брони и тяжёлой интеграции**, чтобы быстрее принимать гостей.\n\nИсточник: ФТ-19, ИТ-10\n\n### Разобраться в акции\nКогда я впервые открываю сканер, хочу **сразу найти инструкцию и поддержку**, чтобы начать без звонков.\n\nИсточник: ИТ-9, ФТ-13\n\n## Design\n\n### Где и когда\nПриложение-сканер, первый запуск после подключения.\n\n### Главное на экране\nПодтверждение «Подключён».\n\nИсточник: ИТ-10\n\n### Инструкция и поддержка\nИнструкция, частые вопросы и контакты поддержки — внутри приложения.\n\nИсточник: ИТ-9\n\n### Шаги подключения\n[УТОЧНИТЬ у DineClub] — шаги и экраны подключения, борда FigJam.\n\nИсточник: ИТ-10\n\n### Платформа\nОтдельное приложение, не обязательно нативное.\n\nИсточник: ИТ-8\n\n## Functions\n\n### Подключение завершено\n**Дано** ресторан подал заявку на участие\n**Когда** подключение завершено\n**Тогда** приложение показывает «Подключён»\n**И** открывает инструкцию и поддержку\n\nИсточник: ИТ-10, ИТ-9\n\n### Путь подключения\n**Дано** ресторан начинает подключение\n**Тогда** [УТОЧНИТЬ у DineClub] — шаги без брони и тяжёлой интеграции\n\nИсточник: ФТ-19\n","B1":"# Страница после оплаты\n\n![Блок акции](backlog/assets/screens/B1.svg)\n\n## Product\n\n### Узнать о скидке\nКогда я купил билет на офлайн-мероприятие, хочу **сразу узнать о скидке 10%** в ресторанах рядом, чтобы не пропустить выгоду.\n\nИсточник: ПТ-2\n\n### Увидеть рестораны рядом\nКогда я вижу предложение, хочу **видеть рестораны у площадки своего билета**, чтобы понять, куда идти.\n\nИсточник: ИТ-1, ФТ-3\n\n### Перейти к выбору\nКогда я решил сходить в ресторан, хочу **перейти к выбору**, чтобы найти подходящий рядом с театром.\n\nИсточник: ПТ-3\n\n## Design\n\n### Где и когда\nВитрина, страница после оплаты. Покупка только что подтверждена.\n\n### Главное на экране\nОбещание «вам доступна скидка 10%».\n\nИсточник: ИТ-1\n\n### Полка ресторанов\nРестораны-участники, первыми — у площадки билета.\n\nИсточник: ИТ-1, ФТ-3\n\n### Куда дальше\n«Выбрать ресторан» ведёт к списку всех ресторанов.\n\nИсточник: ИТ-1\n\n### Тексты\nБез склонений названий мероприятий. Проверка: «Королевские игры», «Mamma Mia», «Ленком».\n\nИсточник: НФТ-3\n\n### Айдентика\nФиолетовая айдентика акции, один дизайнер на все блоки.\n\nИсточник: НФТ-4\n\n## Functions\n\n### Офлайн-билет\n**Дано** гость купил билет на офлайн-мероприятие\n**Когда** открывается страница после оплаты\n**Тогда** виден блок «вам доступна скидка 10%»\n**И** полка ресторанов-участников\n\nИсточник: ИТ-1, ФТ-2\n\n### Онлайн-мероприятие\n**Дано** гость купил билет на онлайн-мероприятие\n**Тогда** блока акции нет\n\nИсточник: ФТ-2\n\n### Переход к выбору\n**Когда** гость нажимает «Выбрать ресторан»\n**Тогда** открывается список всех ресторанов\n**И** событие уходит в Метрику\n\nИсточник: ПТ-3, ФТ-2\n\n### Рядом нет ресторанов\n**Дано** у площадки нет ресторанов-участников\n**Тогда** [УТОЧНИТЬ у UnitB] — что показывать в полке\n\nИсточник: ФТ-3\n\n### Каталог недоступен\n**Дано** каталог ресторанов не отвечает\n**Когда** открывается страница после оплаты\n**Тогда** [УТОЧНИТЬ у Витрина] — вид страницы без полки\n\nИсточник: ФТ-2, НФТ-1\n\n### Другой город\n**Дано** мероприятие не в Москве и не в Санкт-Петербурге\n**Тогда** [УТОЧНИТЬ у PO] — показывать ли блок\n","C1":"# Письмо с билетом\n\n![Письмо](backlog/assets/screens/C1.svg)\n\n## Product\n\n### Увидеть предложение в письме\nКогда я открываю письмо с билетом, хочу **увидеть то же предложение о скидке**, чтобы не пропустить его.\n\nИсточник: ПТ-2, ФТ-5\n\n### Перейти к ресторанам\nКогда я решил выбрать ресторан, хочу **одной кнопкой перейти к акционным ресторанам**.\n\nИсточник: ФТ-5\n\n## Design\n\n### Где и когда\nТранзакционное письмо с билетом, сразу после покупки.\n\n### Главное в письме\nОдин акцентный офер — скидка 10%, в компактной плашке.\n\nИсточник: ИТ-2, ФТ-5\n\n### Второстепенное\n«Забронировать в DineClub» — вторичной кнопкой.\n\nИсточник: ИТ-2\n\n### Мобильный размер\nПисьмо читается на ширине до 600px.\n\nИсточник: ИТ-2\n\n### Тексты\nБез склонений названий мероприятий.\n\nИсточник: НФТ-3\n\n## Functions\n\n### Письмо после покупки\n**Дано** гость купил офлайн-билет\n**Когда** приходит письмо с билетом\n**Тогда** в нём плашка акции с одним офером\n\nИсточник: ФТ-5\n\n### Переход из письма\n**Когда** гость нажимает «Выбрать ресторан»\n**Тогда** открывается страница акционных ресторанов\n**И** клик размечен\n\nИсточник: ФТ-5, ИТ-2\n\n### Письмо не доставлено\n**Дано** письмо не дошло\n**Тогда** [УТОЧНИТЬ у CPO продукта] — повторная отправка или другой канал\n\nИсточник: ФТ-6\n\n### Ресторан добавлен позже\n**Дано** ресторан вошёл в акцию после покупки билета\n**Тогда** [УТОЧНИТЬ у UnitB] — актуален ли список в письме\n","D1":"# Все рестораны\n\n![Список](backlog/assets/screens/D1.svg)\n\n## Product\n\n### Выбрать ресторан рядом\nКогда я выбираю, куда пойти, хочу **полный список ресторанов-участников с фильтрами**, чтобы быстро выбрать подходящий рядом с театром.\n\nИсточник: ПТ-3\n\n## Design\n\n### Где и когда\nВитрина, раздел «Все рестораны» после перехода из блока акции или письма.\n\n### Главное на экране\nПолный список участников — без обрезки радиусом.\n\nИсточник: ИТ-3\n\n### Порядок\nБлижние и с высоким рейтингом выше, первыми — у площадки билета.\n\nИсточник: ФТ-3\n\n### Фильтры\n- количество персон\n- можно ли с животными\n- средний чек\n- близость к метро\n- тип кухни\n\nИсточник: ИТ-7\n\n### Расположение фильтров\n[УТОЧНИТЬ у Дизайн] — расположение и поведение фильтров на макете.\n\nИсточник: ИТ-7\n\n## Functions\n\n### Полный список\n**Дано** у гостя активный билет\n**Когда** он открывает «Все рестораны»\n**Тогда** видны все участники\n**И** первыми — рестораны у площадки билета\n\nИсточник: ИТ-3, ФТ-3\n\n### Фильтр\n**Когда** гость выбирает фильтр\n**Тогда** список сужается\n**И** событие фильтра уходит в метрики\n\nИсточник: ФТ-11\n\n### Пустой результат\n**Дано** фильтры не оставили ни одного ресторана\n**Тогда** [УТОЧНИТЬ у PO] — пустое состояние и подсказка\n\nИсточник: ФТ-11\n\n### Несколько активных билетов\n**Дано** у гостя билеты на разные площадки\n**Тогда** [УТОЧНИТЬ у PO] — какие рестораны первыми\n\nИсточник: ФТ-3\n\n### Нет рейтинга\n**Дано** у ресторана нет рейтинга\n**Тогда** [УТОЧНИТЬ у UnitB] — его место в списке\n\nИсточник: НФТ-2\n","D2":"# Карточка ресторана\n\n![Карточка](backlog/assets/screens/D2.svg)\n\n## Product\n\n### Решить, идти ли\nКогда я смотрю ресторан, хочу **видеть скидку, путь пешком и часы работы**, чтобы решить, идти ли.\n\nИсточник: ИТ-4\n\n## Design\n\n### Где и когда\nВитрина, карточка ресторана из списка.\n\n### Главное на экране\nЗаметный блок акции — виден без скролла.\n\nИсточник: ИТ-4\n\n### Путь пешком\nВремя в пути пешком от площадки последнего билета.\n\nИсточник: ИТ-4\n\n### Часы работы\nЧасы работы у каждого ресторана-участника.\n\nИсточник: ИТ-4\n\n## Functions\n\n### Блок акции\n**Дано** ресторан участвует в акции\n**Когда** гость открывает карточку\n**Тогда** блок акции виден без скролла\n\nИсточник: ИТ-4, ФТ-4\n\n### Путь пешком\n**Дано** у гостя есть билет\n**Когда** открыта карточка ресторана\n**Тогда** время пешком от площадки отличается от картографического не больше чем на 2 минуты\n\nИсточник: ИТ-4\n\n### Нет часов работы\n**Дано** у ресторана нет часов работы в справочнике\n**Тогда** [УТОЧНИТЬ у UnitB] — источник и показ\n\nИсточник: ФТ-4\n\n### Ресторан вышел из акции\n**Дано** ресторан вышел из акции после покупки билета\n**Тогда** [УТОЧНИТЬ у DineClub] — что видит гость\n","E1":"# Оповещение накануне\n\n![Оповещение](backlog/assets/screens/E1.svg)\n\n## Product\n\n### Не забыть о скидке\nКогда до мероприятия остались сутки, хочу **получить напоминание о скидке**, чтобы зайти в ресторан рядом.\n\nИсточник: ФТ-16\n\n## Design\n\n### Где и когда\nУведомление за 24 часа до мероприятия.\n\nИсточник: ФТ-16\n\n### Главное\n«Мероприятие завтра» и скидка 10% в ресторанах рядом.\n\nИсточник: ИТ-6\n\n### Канал\n[УТОЧНИТЬ у CPO продукта] — каким каналом приходит оповещение.\n\nИсточник: ИТ-6\n\n## Functions\n\n### За сутки до мероприятия\n**Дано** гость купил офлайн-билет\n**Когда** до мероприятия 24 часа\n**Тогда** приходит оповещение о скидке\n\nИсточник: ФТ-16, ИТ-6\n\n### Гость отписан\n**Дано** гость отписался от касаний\n**Тогда** оповещение не приходит\n\nИсточник: ФТ-6\n\n### Нет email или телефона\n**Дано** у гостя нет нужного контакта\n**Тогда** [УТОЧНИТЬ у CPO продукта] — доступный канал\n\nИсточник: ФТ-6\n","E2":"# Напоминание после мероприятия\n\n![Напоминание](backlog/assets/screens/E2.svg)\n\n## Product\n\n### Успеть воспользоваться\nКогда мероприятие прошло, хочу **знать, что скидка ещё действует**, чтобы успеть ею воспользоваться.\n\nИсточник: ИТ-6, ФТ-6\n\n## Design\n\n### Где и когда\nПисьмо или SMS в окне 7 дней после мероприятия.\n\nИсточник: ФТ-6\n\n### Главное\n«Скидка 10% ещё действует» и срок — 7 дней после мероприятия.\n\nИсточник: ИТ-6\n\n### Отписка\nСсылка «Отписаться» — отписки соблюдаются.\n\nИсточник: ИТ-6\n\n## Functions\n\n### Напоминание в окне\n**Дано** мероприятие прошло, окно скидки открыто\n**Тогда** приходит хотя бы одно напоминание письмом или SMS\n\nИсточник: ИТ-6\n\n### Скидка уже использована\n**Дано** гость уже получил скидку по этому билету\n**Тогда** [УТОЧНИТЬ у CPO продукта] — прекращаются ли напоминания\n\nИсточник: ФТ-6\n\n### Пересечение с рассылками\n**Дано** у гостя есть и обычные рассылки\n**Тогда** [УТОЧНИТЬ у CPO продукта] — лимит частоты касаний\n\nИсточник: ФТ-6\n","F1":"# Электронный билет в ресторане\n\n![Билет](backlog/assets/screens/F1.svg)\n\n## Product\n\n### Получить скидку по билету\nКогда я прихожу в ресторан в течение 7 дней после мероприятия, хочу **просто показать билет**, чтобы получить скидку 10% без брони.\n\nИсточник: ПТ-1\n\n## Design\n\n### Где и когда\nТелефон гостя, в ресторане, перед оплатой.\n\n### Главное на экране\nШтрихкод билета — его сканирует официант.\n\nИсточник: ПТ-1\n\n### Напоминание об акции\nПлашка «Скидка 10% в DineClub».\n\nИсточник: ИТ-1\n\n## Functions\n\n### Билет в окне скидки\n**Дано** после мероприятия прошло не больше 7 дней\n**Когда** гость показывает билет официанту\n**Тогда** официант сканирует штрихкод\n**И** бронь не нужна\n\nИсточник: ПТ-1\n\n### Несколько билетов, один чек\n**Дано** компания пришла с несколькими билетами\n**Тогда** [УТОЧНИТЬ у PO] — одна скидка на чек или по числу билетов\n\nИсточник: ПТ-1\n\n### Билет передан другому\n**Дано** билет показывает не покупатель\n**Тогда** [УТОЧНИТЬ у DineClub] — привязана ли скидка к владельцу\n","F2":"# Сканер — сканирование\n\n![Сканирование](backlog/assets/screens/F2.svg)\n\n## Product\n\n### Проверить билет\nКогда гость показал билет, хочу **отсканировать штрихкод**, чтобы проверить его.\n\nИсточник: ПТ-4\n\n## Design\n\n### Где и когда\nТелефон официанта, гость за столом показывает билет.\n\n### Главное на экране\nКамера для штрихкода и кнопка «Сканировать».\n\nИсточник: ИТ-8\n\n## Functions\n\n### Сканирование\n**Когда** официант наводит камеру на штрихкод\n**Тогда** билет уходит на проверку\n\nИсточник: ИТ-8, ФТ-1\n\n### Штрихкод не читается\n**Дано** штрихкод повреждён, это скриншот или блик\n**Тогда** [УТОЧНИТЬ у DineClub] — ручной ввод или отказ\n\nИсточник: ФТ-1\n\n### Нет интернета\n**Дано** у ресторана нет сети\n**Тогда** [УТОЧНИТЬ у DineClub] — работа без сети\n\nИсточник: ФТ-8\n","F3":"# Сканер — результат проверки\n\n![Скидка 10%](backlog/assets/screens/F3.svg)\n![Отказ](backlog/assets/screens/F4.svg)\n\n## Product\n\n### Понять, давать ли скидку\nКогда я отсканировал билет, хочу **сразу понять, давать ли скидку**, чтобы не спорить с гостем.\n\nИсточник: ФТ-1, ФТ-8\n\n### Видеть причину отказа\nКогда билет не прошёл, хочу **видеть причину**, чтобы объяснить её гостю.\n\nИсточник: ФТ-1\n\n### Перейти к фото чека\nКогда скидка дана, хочу **сразу перейти к фото чека**, чтобы ресторан получил компенсацию.\n\nИсточник: ИТ-8\n\n### Открыть помощь\nКогда я не знаю, что делать, хочу **открыть инструкцию и поддержку**, чтобы не задерживать гостя.\n\nИсточник: ФТ-13\n\n## Design\n\n### Где и когда\nТелефон официанта. Гость за столом, билет только что отсканирован.\n\n### Главное на экране\nСкидка 10% или отказ — без двусмысленности.\n\nИсточник: ИТ-8\n\n### Причина отказа\nПростыми словами: «использован», «вне окна 7 дней», «возвращён».\n\n![Отказ](backlog/assets/screens/F4.svg)\n\nИсточник: ФТ-1\n\n### Куда дальше\n- При успехе — фото чека\n- При отказе — инструкция и поддержка\n\nИсточник: ИТ-8, ФТ-13\n\n## Functions\n\n### Действующий билет\n**Дано** билет активен, не использован, мероприятие было не больше 7 дней назад\n**Когда** официант сканирует штрихкод\n**Тогда** экран «Скидка 10%»\n**И** билет помечен «использован»\n\nИсточник: ФТ-1, ИТ-8\n\n### Повторное сканирование\n**Дано** билет уже использован\n**Когда** официант сканирует штрихкод\n**Тогда** отказ с причиной «использован»\n\nИсточник: ФТ-1\n\n### Вне окна 7 дней\n**Дано** мероприятие было больше 7 дней назад\n**Когда** официант сканирует штрихкод\n**Тогда** отказ с понятной причиной\n\nИсточник: ФТ-1\n\n### Билет возвращён\n**Дано** гость вернул билет\n**Когда** официант сканирует штрихкод\n**Тогда** [УТОЧНИТЬ у PO] — остаётся ли скидка\n\nИсточник: ФТ-15\n\n### Мероприятие отменено или перенесено\n**Дано** мероприятие отменили или перенесли\n**Тогда** [УТОЧНИТЬ у DineClub] — работает ли билет\n\nИсточник: ФТ-15\n\n### Сервис проверки недоступен\n**Дано** сервис проверки билетов не отвечает\n**Тогда** [УТОЧНИТЬ у DineClub] — скидка вручную и компенсация\n\nИсточник: ФТ-1, НФТ-1\n","F5":"# Сканер — фото чека\n\n![Чек сохранён](backlog/assets/screens/F5.svg)\n\n## Product\n\n### Получить компенсацию\nКогда скидка дана и гость оплатил, хочу **сфотографировать чек**, чтобы ресторан получил компенсацию.\n\nИсточник: ИТ-8, ФТ-8\n\n## Design\n\n### Где и когда\nТелефон официанта, после оплаты счёта.\n\n### Главное на экране\nПодтверждение «Чек сохранён» — компенсация зафиксирована.\n\nИсточник: ИТ-8\n\n## Functions\n\n### Фото чека\n**Дано** скидка по билету дана\n**Когда** официант фотографирует чек\n**Тогда** компенсация ресторану зафиксирована\n**И** Acme Tickets получает уведомление о списании\n\nИсточник: ИТ-8, ФТ-14\n\n### Фото нечитаемо\n**Дано** чек не сфотографирован или фото нечитаемо\n**Тогда** [УТОЧНИТЬ у DineClub] — блокирует ли это компенсацию\n\nИсточник: ФТ-8\n\n### Лимит компенсаций\n**Дано** ресторан достиг лимита компенсаций\n**Тогда** [УТОЧНИТЬ у DineClub] — есть ли лимит и что дальше\n\nИсточник: ФТ-14\n","F6":"# Сканер — инструкция и поддержка\n\n![Инструкция и FAQ](backlog/assets/screens/F6.svg)\n\n## Product\n\n### Найти помощь\nКогда я не знаю, что делать, хочу **найти инструкцию, частые вопросы и поддержку в приложении**, чтобы выдать скидку без ошибок.\n\nИсточник: ПТ-4, ФТ-13\n\n## Design\n\n### Где и когда\nПриложение-сканер, раздел помощи — из отказа или в любой момент.\n\n### Инструкция\nКраткая инструкция, как работает акция.\n\nИсточник: ИТ-9\n\n### Частые вопросы\nНабор популярных вопросов внутри приложения.\n\nИсточник: ИТ-9\n\n### Контакты поддержки\nНомер телефона и почта.\n\nИсточник: ИТ-9\n\n### Инструкция для ресторанов\nОтдельным материалом, вне приложения.\n\nИсточник: ИТ-9\n\n## Functions\n\n### Открыть помощь\n**Когда** официант открывает помощь\n**Тогда** видны инструкция, частые вопросы и контакты поддержки\n\nИсточник: ФТ-13\n\n### Контакты\n**Дано** официанту нужна поддержка\n**Тогда** [УТОЧНИТЬ у PO] — номер и почта поддержки\n\nИсточник: ФТ-13\n"},"noteFiles":{"A1":"backlog/docs/screens/doc-3 - A1-·-Сканер-—-ресторан-подключён.md","B1":"backlog/docs/screens/doc-4 - B1-·-Страница-после-оплаты.md","C1":"backlog/docs/screens/doc-5 - C1-·-Письмо-с-билетом.md","D1":"backlog/docs/screens/doc-6 - D1-·-Все-рестораны.md","D2":"backlog/docs/screens/doc-7 - D2-·-Карточка-ресторана.md","E1":"backlog/docs/screens/doc-8 - E1-·-Оповещение-накануне.md","E2":"backlog/docs/screens/doc-9 - E2-·-Напоминание-после-мероприятия.md","F1":"backlog/docs/screens/doc-10 - F1-·-Электронный-билет-в-ресторане.md","F2":"backlog/docs/screens/doc-11 - F2-·-Сканер-—-сканирование.md","F3":"backlog/docs/screens/doc-12 - F3-·-Сканер-—-результат-проверки.md","F5":"backlog/docs/screens/doc-13 - F5-·-Сканер-—-фото-чека.md","F6":"backlog/docs/screens/doc-14 - F6-·-Сканер-—-инструкция-и-поддержка.md"},"docs":{"doc-1":{"title":"Карта","file":"backlog/docs/doc-1 - Карта.md","screen":""},"doc-15":{"title":"ADR","file":"backlog/docs/doc-15 - ADR.md","screen":""},"doc-16":{"title":"Системные требования","file":"backlog/docs/doc-16 - Системные требования.md","screen":""},"doc-17":{"title":"Стыки","file":"backlog/docs/doc-17 - Стыки.md","screen":""},"doc-18":{"title":"Roadmap","file":"backlog/docs/doc-18 - Roadmap.md","screen":""},"doc-19":{"title":"Риски исполнения","file":"backlog/docs/doc-19 - Риски-исполнения.md","screen":""},"doc-2":{"title":"История","file":"backlog/docs/doc-2 - История.md","screen":""},"doc-10":{"title":"F1 · Электронный билет в ресторане","file":"backlog/docs/screens/doc-10 - F1-·-Электронный-билет-в-ресторане.md","screen":"F1"},"doc-11":{"title":"F2 · Сканер — ска   function wrapT(t, n) { const w = String(t).split(" "); const o = []; let c = ""; for (const x of w) { if ((c + " " + x).trim().length > n) { if (c) o.push(c); c = x } else c = (c + " " + x).trim() } if (c) o.push(c); return o }
  function mockSVG(t, label) {
    const W = 150, H = 250, ink = "#1f1f1f", g = "#9a958c", OF = "#6b3fd4", P = 11, IW = W - 2 * P;
    const T = (x, yy, s, fs, fw, fill, a) => `<text x="${x}" y="${yy}" font-size="${fs}" font-weight="${fw || 400}" fill="${fill || ink}"${a ? ` text-anchor="${a}"` : ""}>${esc(s)}</text>`;
    if (t.view === "неизвестен") {
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} — не определён"><rect x="1.5" y="1.5" width="${W - 3}" height="${H - 3}" rx="20" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="${W / 2}" cy="${H / 2 - 14}" r="20" fill="#c0392b"/>${T(W / 2, H / 2 - 6, "?", 24, 800, "#fff", "middle")}${wrapT(t.contour, 16).map((l, i) => T(W / 2, H / 2 + 30 + i * 14, l, 11, 600, "#c0392b", "middle")).join("")}${T(W / 2, H / 2 + 30 + wrapT(t.contour, 16).length * 14, "не определён", 11, 600, "#c0392b", "middle")}</svg>`;
    }
    let y, out = "", frame;
    if (t.device === "web") { y = 26; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="10" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/><path d="M1,11 a10,10 0 0 1 10,-10 h${W - 22} a10,10 0 0 1 10,10 v7 h-${W - 2}z" fill="#efede8"/>` + [0, 1, 2].map(i => `<circle cx="${10 + i * 7}" cy="10" r="2.2" fill="#bdb8af"/>`).join("") }
    else if (t.device === "mail") { y = 12; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="10" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/>` }
    else if (t.device === "lock") { y = 78; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="22" fill="#e6e2db" stroke="#2b2b2b" stroke-width="1.5"/><rect x="${W / 2 - 20}" y="7" width="40" height="7" rx="3.5" fill="#2b2b2b"/>` + T(W / 2, 56, "09:41", 30, 300, "#555", "middle") }
    else { y = 24; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="22" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/><rect x="${W / 2 - 20}" y="7" width="40" height="7" rx="3.5" fill="#2b2b2b"/>` }
    for (const it of t.el) {
      const k = it[0];
      if (k === "from") { out += `<path d="M${P},${y} h18 v12 h-18z M${P},${y} l9,7 l9,-7" fill="none" stroke="${g}" stroke-width="1.3"/>` + T(P + 24, y + 10, it[1], 10, 600, g); y += 22 }
      else if (k === "hdr") { const ok = it[1].startsWith("✓ "); out += ok ? `<circle cx="${P + 7}" cy="${y + 7}" r="7" fill="${ink}"/><path d="M${P + 3.5},${y + 7} l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8"/>` + T(P + 19, y + 11.5, it[1].slice(2), 12, 700) : T(P, y + 11.5, it[1], 12, 700); y += 22 }
      else if (k === "text") { wrapT(it[1], 22).forEach(l => { out += T(P, y + 11, l, 10.5, 400, g); y += 13 }); y += 5 }
      else if (k === "offer") { const ls = wrapT(it[1], 13), h = ls.length * 16 + 16; out += `<rect x="${P}" y="${y}" width="${IW}" height="${h}" rx="9" fill="${OF}"/>`; ls.forEach((l, i) => out += T(P + 10, y + 20 + i * 16, l, 13, 800, "#fff")); y += h + 9 }
      else if (k === "cta" || k === "cta2") { const fs = it[1].length > 16 ? 9.5 : 11; out += `<rect x="${P}" y="${y}" width="${IW}" height="26" rx="13" fill="${k === "cta" ? ink : "#fff"}" stroke="${ink}" stroke-width="1.2"/>` + T(W / 2, y + 17, it[1], fs, 700, k === "cta" ? "#fff" : ink, "middle"); y += 32 }
      else if (k === "link") { out += T(P, y + 12, it[1], 11, 700, ink) + `<line x1="${P}" y1="${y + 15}" x2="${P + Math.min(IW, it[1].length * 6)}" y2="${y + 15}" stroke="${ink}"/>`; y += 22 }
      else if (k === "tiles") { const tw = (IW - 8) / 2; [0, 1].forEach(i => { const x = P + i * (tw + 8); out += `<rect x="${x}" y="${y}" width="${tw}" height="58" rx="7" fill="#fff" stroke="#d6d2ca"/><rect x="${x + 5}" y="${y + 5}" width="${tw - 10}" height="24" rx="4" fill="#ece9e3"/><rect x="${x + 5}" y="${y + 35}" width="${tw - 22}" height="6" rx="3" fill="#cfcac0"/><rect x="${x + 5}" y="${y + 46}" width="${tw - 34}" height="5" rx="2.5" fill="#e3dfd8"/><rect x="${x + tw - 27}" y="${y + 8}" width="22" height="13" rx="6.5" fill="${OF}"/>` }); y += 66 }
      else if (k === "rows" || k === "rowsOffer") { for (let i = 0; i < it[1]; i++) { out += `<rect x="${P}" y="${y}" width="26" height="26" rx="5" fill="#ece9e3"/><rect x="${P + 33}" y="${y + 5}" width="58" height="6" rx="3" fill="#cfcac0"/><rect x="${P + 33}" y="${y + 16}" width="40" height="5" rx="2.5" fill="#e3dfd8"/>`; if (k === "rowsOffer") out += `<rect x="${W - P - 28}" y="${y + 6}" width="28" height="14" rx="7" fill="${OF}"/>`; y += 34 } }
      else if (k === "chips") { let x = P; it[1].forEach(c => { const w = c.length * 6 + 14; if (x + w > W - P) return; out += `<rect x="${x}" y="${y}" width="${w}" height="20" rx="10" fill="#fff" stroke="#9a958c"/>` + T(x + 7, y + 14, c, 10, 600); x += w + 5 }); y += 30 }
      else if (k === "kv") { out += T(P, y + 12, it[1], 10.5, 400, g) + T(W - P, y + 12, it[2], 11, 700, ink, "end") + `<line x1="${P}" y1="${y + 19}" x2="${W - P}" y2="${y + 19}" stroke="#eee"/>`; y += 24 }
      else if (k === "img") { out += `<rect x="${P}" y="${y}" width="${IW}" height="56" rx="7" fill="#ece9e3"/><path d="M${P + 20},${y + 44} l18,-20 l14,14 l10,-9 l18,15z" fill="#d6d1c8"/>`; y += 64 }
      else if (k === "camera") { out += `<rect x="${P}" y="${y}" width="${IW}" height="112" rx="8" fill="#2b2b2b"/>`;[[P + 10, y + 10, 1, 1], [W - P - 10, y + 10, -1, 1], [P + 10, y + 102, 1, -1], [W - P - 10, y + 102, -1, -1]].forEach(([x, yy, dx, dy]) => out += `<path d="M${x},${yy + 14 * dy} V${yy} H${x + 14 * dx}" fill="none" stroke="#fff" stroke-width="2.4"/>`); for (let i = 0; i < 20; i++) out += `<rect x="${P + 28 + i * 4.3}" y="${y + 38}" width="${i % 3 ? 1.4 : 2.8}" height="36" fill="#fff"/>`; y += 120 }
      else if (k === "ok" || k === "no") { const cx = W / 2, cy = y + 30, col = k === "ok" ? "#2f6b2a" : "#c0392b"; out += `<circle cx="${cx}" cy="${cy}" r="24" fill="${col}"/>` + (k === "ok" ? `<path d="M${cx - 11},${cy} l8,8 l14,-15" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>` : `<path d="M${cx - 9},${cy - 9} l18,18 M${cx + 9},${cy - 9} l-18,18" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>`); y += 64; out += T(cx, y + 6, it[1], 14, 800, k === "ok" ? ink : "#c0392b", "middle"); y += 22 }
      else if (k === "barcode") { out += `<rect x="${P}" y="${y}" width="${IW}" height="70" rx="8" fill="#fff" stroke="#d6d2ca"/>`; for (let i = 0; i < 24; i++) out += `<rect x="${P + 14 + i * 4.6}" y="${y + 12}" width="${i % 3 ? 1.5 : 3}" height="46" fill="${ink}"/>`; y += 80 }
      else if (k === "notif") { const tl = wrapT(it[2], 17), ls = wrapT(it[3], 20), h = 34 + tl.length * 15 + ls.length * 13; out += `<rect x="${P - 3}" y="${y}" width="${IW + 6}" height="${h}" rx="12" fill="#fff"/><rect x="${P + 5}" y="${y + 8}" width="16" height="16" rx="4" fill="${OF}"/>` + T(P + 26, y + 20, it[1], 9.5, 600, g); tl.forEach((l, i) => out += T(P + 5, y + 42 + i * 15, l, 11.5, 800)); ls.forEach((l, i) => out += T(P + 5, y + 42 + tl.length * 15 + i * 13, l, 10.5, 400, "#444")); y += h + 10 }
    }
    const alt = t.view === "альтернативный" ? `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="${t.device === "web" || t.device === "mail" ? 10 : 22}" fill="none" stroke="#c0392b" stroke-width="2.2"/>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${frame}${out}${alt}</svg>`;
  }
  return { esc, wrapT, ICON, contourIcon, chip, mockSVG };
})();
</script>
<script>
/* bft-blueprint · карта инициативы. Данные — #map-data (собирает bft-backlog-build.py из проекта Backlog.md).
   Три слоя чтения: «Что видят» (история), «Что делаем» (задачи команд), «Как это работает»
   (Employee Actions, Technology, Backstage, Support). Подробности — по клику, в боковой панели. */
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("map-data").textContent);
  const { esc, chip } = BPK;
  /* слой «Архитектура»: данные ADR и системных требований — объявлены до первого
     использования (mstack ниже читает AR/SR при загрузке, экран — по клику) */
  const AR = D.adr || null, SR = D.sysreq || null;
  let arCur = "adr"; /* активная вкладка слоя «Архитектура» — тоже до первого использования */
  /* файлы проекта — от страницы: страница лежит в папке проекта (blueprint.html) или рядом с ней */
  const B = D.base || "", fileURL = p => /^(https?:|data:)/.test(p) ? p : B + p.split("/").map(encodeURIComponent).join("/");
  const body = document.body, grid = document.getElementById("grid");
  const MARK = "[УТОЧНИТЬ";
  const U = t => String(t || "").includes(MARK);

  /* ---------- справочники ---------- */
  const COLS = [...D.stages, { id: "стало", name: "Итог", when: "" }];
  const colOf = st => COLS.findIndex(c => c.id === st);
  const TEAM = {}; D.teams.forEach((t, i) => TEAM[t.id] = { name: t.name, c: `var(--t${i % 10})` });
  const teamC = t => t.team === "?" || !TEAM[t.team] ? "var(--red)" : TEAM[t.team].c;
  const teamN = t => t.team === "?" || !TEAM[t.team] ? "Команда?" : TEAM[t.team].name;
  const TASK = {}; D.tasks.forEach(t => TASK[t.id] = t);
  const PROC = {}; D.cards.forEach(p => PROC[p.id] = p);
  /* эпик (БФТ) → история (задача «Что делаем») → подзадачи по зонам; история в одном контуре — без подзадач */
  const ZONES = ["PO", "BA", "SA", "ADR", "Design", "BE", "DBA", "FE", "DevOps", "QA", "Delivery"];
  /* постановка подзадачи — в формате зоны; чеклист называется по смыслу зоны */
  const ZONE_SECS = { Design: ["UserStory", "JobStory", "UserFlow"], BE: ["ASIS", "GAP", "TOBE", "Данные"], DBA: ["ASIS", "GAP", "TOBE"], FE: ["ASIS", "GAP", "TOBE"], DevOps: ["ASIS", "GAP", "TOBE"] };
  const ZONE_CHECK = { PO: "Согласования", BA: "Вопросы по бизнес-логике", SA: "Вопросы по системной реализации", ADR: "Решения", Design: "На экране" };
  const SUBS = D.subs || [], SUB = {}; SUBS.forEach(z => SUB[z.id] = z);
  const subsOf = id => SUBS.filter(z => z.task === id).sort((a, b) => ZONES.indexOf(a.zone) - ZONES.indexOf(b.zone));
  /* MoSCoW: Must и Should — коммитмент заказчику, Would — за линией Out of scope */
  const PRIO = { must: "Must", should: "Should", would: "Would" }, PRIO_ORD = { must: 0, should: 1, "": 2, would: 3 };
  const oos = t => t && t.prio === "would";
  const byPrio = list => list.slice().sort((a, b) => PRIO_ORD[a.prio || ""] - PRIO_ORD[b.prio || ""]);
  const leadOf = t => t.team in TEAM && (D.teams.find(x => x.id === t.team) || {}).lead || "";
  const qOf = where => D.questions.filter(q => q.where === where && q.open);
  /* вопросы карты («Карта») и истории («История») — одним списком; ответ PO уходит в промпт агенту */
  const QS = [...D.questions.map(q => ({ ...q, key: "map:" + q.id, doc: "map" })), ...D.storyQuestions.map(q => ({ ...q, kind: "вопрос", key: "story:" + q.id, doc: "story" }))];
  const QK = {}; QS.forEach(q => QK[q.key] = q);
  const qsOf = ids => QS.filter(q => ids.includes(q.where));
  const asks = id => qOf(id).filter(q => q.kind === "вопрос").length;
  const blocks = id => qOf(id).filter(q => q.kind === "блокер");
  const scrOpen = id => D.storyQuestions.some(q => q.where === id);
  /* слои Service Blueprint: на виду у гостя — сотрудник и технологии; за линией видимости — Backstage; ниже — Support */
  const LAYER = { employee: ["Employee Actions", "действия сотрудника", "#a8541a"], technology: ["Technology", "что видит гость", "#0f8b8d"], backstage: ["Backstage", "за кадром", "#2563c9"], support: ["Support", "поддержка: нештатные ситуации", "#6b5fb0"] };
  const PERSONA_ICON = ['<circle cx="8" cy="5.5" r="2.6"/><path d="M3 14c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5"/>', '<path d="M4 2v5a2 2 0 0 0 2 2v5M6 2v4M8 2v5a2 2 0 0 1-2 2M12 14V2c-1.5 1-2.5 3-2.5 5.5H12"/>'];
  const who = p => `<span class="who"><svg viewBox="0 0 16 16">${PERSONA_ICON[Math.min(1, D.personas.findIndex(x => x.id === p.id))]}</svg>${esc(p.name)}</span>`;
  /* экран — картинка из backlog/assets/screens: упрощённый SVG из «Истории» или свой макет */
  const screenImg = id => fileURL(D.screens[id].img);
  const scrPic = id => `<img src="${esc(screenImg(id))}" alt="${esc(D.screens[id].contour)}" loading="lazy" draggable="false">`;
  const mock = (id, w) => `<span class="scrw" style="position:relative;display:block${w ? `;width:${w}px` : ""}">${scrOpen(id) ? '<span class="dot" style="top:-4px;right:-5px"></span>' : ""}${scrPic(id)}</span>`;

  /* ---------- шапка ---------- */
  const uniqBlk = [...new Set(D.questions.filter(q => q.open && q.kind === "блокер").map(q => q.text))];
  document.getElementById("blk").innerHTML = uniqBlk.length ? `<button class="mi blk" data-guide="blk"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M3.5 12.5l9-9"/></svg>Блокеры<b class="cnt">${uniqBlk.length}</b></button>` : "";
  const used = {}; [...D.tasks, ...SUBS].forEach(t => used[t.team] = (used[t.team] || 0) + 1);
  const nTasks = n => `${n} ${n % 10 === 1 && n % 100 !== 11 ? "задача" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "задачи" : "задач"}`;
  document.getElementById("teams").innerHTML = D.teams.filter(t => used[t.id]).map(t => `<button class="tchip" data-tf="${t.id}" style="--c:${TEAM[t.id].c}"><i></i>${esc(t.name)}<b>${nTasks(used[t.id])}</b></button>`).join("") +
    (used["?"] ? `<button class="tchip" data-tf="?" style="--c:var(--red)"><i class="u"></i>Команда не определена<b>${nTasks(used["?"])}</b></button>` : "");
  if (uniqBlk.length) document.getElementById("bdot").textContent = uniqBlk.length;
  /* стыки: кнопка меню видна, только если в проекте есть документ «Стыки» */
  if (D.seams && D.seams.items && D.seams.items.length) {
    const sb = document.querySelector("[data-seamspanel]"), sc = document.getElementById("seamcnt");
    sb.hidden = false; sc.hidden = false; sc.textContent = D.seams.items.length;
  }

  /* ---------- меню: всё, что раньше было в шапке, — поверх карты ---------- */
  const burger = document.getElementById("burger");
  const menu = open => { body.classList.toggle("mopen", open); burger.setAttribute("aria-expanded", open); if (open) document.querySelector("#menu .play").focus() };
  /* фильтр по команде: подсветить её работу, на кнопке меню — чип с крестиком */
  function teamFilter(id) {
    document.querySelectorAll(".tchip").forEach(x => x.classList.toggle("on", x.dataset.tf === id));
    document.querySelectorAll(".ui-story,.ui-card[data-sub]").forEach(x => x.classList.toggle("dim", !!id && !(x.dataset.teams || x.dataset.team).split(" ").includes(id)));
    const t = id && (id === "?" ? { name: "Команда не определена", c: "var(--red)" } : TEAM[id]);
    document.getElementById("fchip").innerHTML = t ? `<button class="fchip" data-tf-clear style="--c:${t.c}" aria-label="Снять фильтр"><i></i>${esc(t.name)}<span aria-hidden="true">×</span></button>` : "";
  }

  /* ---------- карточки ---------- */
  /* карточка «что видят» для ленты телефона: экран, персонаж, заголовок, две строки текста */
  const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c;
  function seenHTML(c) {
    return D.seen.filter(s => s.col === c).map(s => {
      const p = D.personas.find(x => x.id === s.persona), w = who(p);
      if (s.final) return `<div class="seen fin" data-seen="${s.key}" role="button" tabindex="0">${w}${s.big ? `<b class="big">${esc(s.big)}</b>` : ""}<b>${esc(s.title)}</b></div>`;
      const more = s.steps.length - 1;
      return `<div class="seen" data-seen="${s.key}" role="button" tabindex="0"><span class="th">${mock(s.steps[0].screens[0])}</span><div class="sx">${w}<b>${esc(s.steps[0].title)}</b><p>${esc(s.steps[0].text)}</p>${more ? `<span class="more">+${more} ${plural(more, "шаг", "шага", "шагов")}</span>` : ""}</div></div>`;
    }).join("");
  }
  /* компоненты слоя «Что делаем» — страница собирает их из данных Backlog.md, разметку не пишет никто:
     история — пунктирная группа (чип «История», название, приоритет, вопросы и блокер истории);
     работа — карточка (команда, зона, вопросы, блокер, название). Кроссфункциональная история —
     группа с карточками подзадач; история в одном контуре — группа со строкой команды. */
  const uiTeam = w => `<span class="ui-team${w.team === "?" ? " u" : ""}"><i style="--c:${teamC(w)}"></i>${esc(w.team === "?" && w.cand ? "Команда? " + w.cand : teamN(w))}</span>`;
  const uiTags = (id, zone, prio) => { const n = asks(id), b = blocks(id).length;
    return `<span class="ui-tags">${prio && prio !== "must" ? `<span class="ui-prio ${prio}">${PRIO[prio]}</span>` : ""}${zone ? `<span class="ui-zone">${esc(zone)}</span>` : ""}${n && !b ? `<span class="ui-q" title="Открытых вопросов: ${n}">${n}</span>` : ""}${b ? '<span class="ui-blk">Блокер</span>' : ""}</span>` };
  const uiCard = z => `<button class="ui-card${blocks(z.id).length ? " blk" : ""}" data-sub="${esc(z.id)}" data-team="${z.team}"><span class="ui-top">${uiTeam(z)}${uiTags(z.id, z.zone)}</span><span class="ui-title">${esc(z.text)}</span></button>`;
  function taskHTML(t) {
    const subs = subsOf(t.id), teams = [...new Set([t.team, ...subs.map(z => z.team)])].join(" ");
    const head = `<button class="ui-head" data-task="${t.id}"><span class="ui-chip">История</span><span class="ui-name">${esc(t.text)}</span>${subs.length ? uiTags(t.id, "", t.prio) : ""}</button>`;
    const body = subs.length ? subs.map(uiCard).join("")
      : `<button class="ui-card ui-own${blocks(t.id).length ? " blk" : ""}" data-task="${t.id}"><span class="ui-top">${uiTeam(t)}${uiTags(t.id, "", t.prio)}</span></button>`;
    return `<div class="ui-story${oos(t) ? " oos" : ""}" data-teams="${teams}">${head}${body}</div>`;
  }
  /* карточка «Как это работает» — без команды: целевая картинка глазами пользователя, команд исполнения тут ещё нет */
  function procHTML(p) {
    const b = blocks(p.id).length + blocks(p.task).length;
    return `<button class="hw ${p.layer}${b ? " blk" : ""}${oos(TASK[p.task]) ? " oos" : ""}" data-proc="${p.id}"><span>${esc(p.text)}</span></button>`;
  }

  /* ---------- холст ---------- */
  /* Evidence и User Actions делят этап на подстолбцы — группы касания. Группа — путь экранов внутри
     контура: контур и экраны, которые шаг прошёл до этого («Витрина → Все рестораны»); альтернативный
     экран — в группе своего основного. Шаг CJM стоит в группе своего первого экрана, шаг без экрана — в
     последней колонке. Всё — из согласованной истории (шаги и таблица «Экраны»), без новых данных. */
  const scrTitle = sid => { const d = Object.values(D.docs).find(x => x.screen === sid); return d ? d.title.replace(/^[^·]*·\s*/, "") : sid };
  const STEPS = COLS.map((_, c) => D.seen.filter(s => s.col === c && !s.final).flatMap(s => s.steps.map(st => ({ ...st, persona: s.persona, seen: s.key }))));
  /* touchGroups — чистая функция без DOM: самотест навыка проверяет её в node */
  function touchGroups(steps, screens, title) {
    const gs = [], by = {}, at = k => by[k] || (gs.push(by[k] = { path: k, screens: [], steps: [] }), by[k]);
    steps.forEach(st => {
      let chain = [], prev = null, last = null, home = null;

        const sc = screens[sid] || {}, k = sc.contour || "";
        if (k !== prev) { chain = [k]; last = null }
        const key = sc.view === "альтернативный" && last !== null ? last : chain.join(" → ");

  const GROUPS = COLS.map((_, c) => touchGroups(STEPS[c], D.screens, scrTitle));
  /* номер шага в пути персонажа: читать слева направо 1 → 2 → 3, старт — перед первым */

  const SUBW = 210, wOf = c => Math.max(272, Math.max(1, GROUPS[c].length) * SUBW);

  let h = `<div class="mh corner"></div>` + COLS.map((c, i) => `<div class="mh"><span class="n">${i === COLS.length - 1 ? "✓" : i + 1}</span><span class="hx"><b>${esc(c.name)}</b>${c.when ? `<small>${esc(c.when)}</small>` : ""}</span></div>`).join("");
  h += `<div class="ml do">Что делаем</div>` + COLS.map(col => `<div class="mc do">${byPrio(D.tasks.filter(t => t.stage === col.id && !oos(t))).map(taskHTML).join("")}</div>`).join("");
  /* линия Out of scope: под ней — истории Would, они к инициативе относятся, но коммитментом заказчику не обсуждались */
  if (D.tasks.some(oos)) h += `<div class="oosl do"></div><div class="ml do oosm">Out of scope<small>Would — не коммитмент заказчику</small></div>` +

  /* все ряды — даже пустой: «сотрудника на виду у гостя нет» — тоже ответ */
  const pName = id => (D.personas.find(x => x.id === id) || { name: id }).name;
  const sub = (c, cell) => `<div class="sub" style="grid-template-columns:repeat(${Math.max(1, GROUPS[c].length)},minmax(0,1fr))">${GROUPS[c].map(cell).join("")}</div>`;
  /* Evidence — точки касания: что клиент видит (экран, письмо, уведомление); клик — требования к экрану */

    `<div class="mc how l-ev">${sub(c, g => `<div class="sc">${g.path ? `<div class="evh">${esc(g.path)}</div>` : ""}${g.screens.map(evHTML).join("")}</div>`)}</div>`).join("");
  /* User Actions — CJM: старт пути персонажа и его шаги из истории по порядку */
  const trgHTML = tg => `<div class="uat" data-persona="${esc(tg.persona)}" title="Старт пути: ${esc(pName(tg.persona))}"><i></i><span><em>Старт</em><b>${esc(tg.text)}</b><small>${esc(pName(tg.persona).split(/[\s-]+/)[0])}</small></span></div>`;
  const stepHTML = st => `<button class="ua" data-step="${esc(st.id)}" data-seen="${esc(st.seen)}" data-persona="${esc(st.persona)}" data-n="${STEP_NO[st.id]}" title="${esc(pName(st.persona))}: шаг ${STEP_NO[st.id]}"><i>${STEP_NO[st.id]}</i><span><b>${esc(st.title)}</b><small>${esc(pName(st.persona).split(/[\s-]+/)[0])}${st.screens.length ? " · " + st.screens.map(esc).join(", ") : ""}</small></span></button>`;
  h += `<div class="ml hrow how l-user">User Actions<small>старт и шаги клиента по порядку</small></div>` + COLS.map((col, c) => {
    const tgs = (D.triggers || []).filter(tg => tg.stage === col.id);
    return `<div class="mc how l-user">${sub(c, (g, gi) => {
      const mine = tgs.filter(tg => (GROUPS[c].findIndex(x => x.steps.some(st => st.persona === tg.persona)) + 1 || 1) - 1 === gi);
      return `<div class="sc">${mine.map(trgHTML).join("")}${g.steps.map(stepHTML).join("")}</div>`;
    })}${GROUPS[c].length ? "" : tgs.map(trgHTML).join("")}</div>`;
  }).join("");
  Object.keys(LAYER).forEach(l => {
    h += `<div class="ml hrow how l-${l}">${LAYER[l][0]}<small>${LAYER[l][1]}</small></div>` + COLS.map(col => `<div class="mc how l-${l}">${D.cards.filter(p => p.layer === l && p.stage === col.id).map(procHTML).join("")}</div>`).join("");
  });
  grid.innerHTML = h;

  /* стрелки между карточками — из ссылок в «Параметрах»: вход от карточки, выход к карточке.
     Тихие, но читаются всегда: тонкая серая линия, аккуратный наконечник, между карточками ряда — место
     под стрелку; линия не проходит под чужой карточкой — обходит её по краю колонки. Наведение на
     старт, точку входа или карточку подсвечивает всю цепочку, остальное гаснет. */
  function drawLinks() {
    grid.querySelector("svg.hwl")?.remove();
    if (body.dataset.view !== "how") return;
    const g = grid.getBoundingClientRect();
    const R = el => { const r = el.getBoundingClientRect(); return { l: r.left - g.left, r: r.right - g.left, t: r.top - g.top, b: r.bottom - g.top, cx: (r.left + r.right) / 2 - g.left, cy: (r.top + r.bottom) / 2 - g.top } };
    const boxes = [...grid.querySelectorAll(".hw[data-proc]")].map(el => ({ id: el.dataset.proc, ...R(el) }));
    /* вертикаль x от y1 до y2 задевает карточку, кроме своих концов */
    const hits = (x, y1, y2, skip) => boxes.some(q => !skip.includes(q.id) && x > q.l - 2 && x < q.r + 2 && Math.max(y1, y2) > q.t && Math.min(y1, y2) < q.b);
    const edges = [];
    let s = `<svg class="hwl" width="${grid.scrollWidth}" height="${grid.scrollHeight}"><defs><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9b968c"/></marker><marker id="mho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f6fd0"/></marker><marker id="mhj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3f7a38"/></marker></defs>`;
    const path = (pts, a, b) => { edges.push([a, b]); const d = `M${pts.map(p => p.map(Math.round).join(",")).join(" L")}`;
      return `<g class="ln" data-a="${esc(a)}" data-b="${esc(b)}"><path class="halo" d="${d}"/><path class="ar" d="${d}" marker-end="url(#mh)"/></g>` };
    /* вниз или вверх по колонке: прямо, а если на пути чужая карточка — по левому краю колонки */
    const vert = (x, A, B, a, b, skip) => {
      const down = B.t > A.b, y1 = down ? A.b : A.t, y2 = down ? B.t : B.b;
      if (!hits(x, y1, y2, skip)) return path([[x, y1], [x, y2]], a, b);
      const x0 = Math.min(A.l, B.l), gx = x0 - 4 - 4 * Math.min(2, lane[x0] = (lane[x0] ?? -1) + 1);
      return path([[A.l, A.cy], [gx, A.cy], [gx, B.cy], [B.l, B.cy]], a, b);
    };
    const seen = new Set(), lane = {};
    D.links.forEach(l => {
      if (!PROC[l.src] || !PROC[l.dst]) return;
      // на карте — только соседние шаги; полная цепочка живёт в карточке процесса
      if (Math.abs(colOf(PROC[l.src].stage) - colOf(PROC[l.dst].stage)) > 1) return;
      const key = [l.src, l.dst].sort().join(); if (seen.has(key)) return; seen.add(key);
      const ea = grid.querySelector(`[data-proc="${l.src}"]`), eb = grid.querySelector(`[data-proc="${l.dst}"]`); if (!ea || !eb) return;
      const A = R(ea), B = R(eb);
      if (Math.abs(A.cx - B.cx) < 40) s += vert(A.cx, A, B, l.src, l.dst, [l.src, l.dst]);
      else if (B.l > A.r) s += Math.abs(A.cy - B.cy) < 3 ? path([[A.r, A.cy], [B.l, B.cy]], l.src, l.dst) : path([[A.r, A.cy], [B.l - 8, A.cy], [B.l - 8, B.cy], [B.l, B.cy]], l.src, l.dst);

    const cellOf = el => [...grid.children].indexOf(el.closest(".mc")) % (COLS.length + 1);
    /* старт → первый шаг персонажа на этапе */
    grid.querySelectorAll(".uat").forEach(tg => {
      const dot = [...grid.children][[...grid.children].indexOf(tg.closest(".mc"))].querySelector(`.ua[data-persona="${tg.dataset.persona}"]`); if (!dot) return;
      const A = R(tg.querySelector("i")), B = R(dot.querySelector("i"));
      s += Math.abs(A.cx - B.cx) < 4 ? path([[A.cx, A.b], [B.cx, B.t]], "tg:" + tg.dataset.persona, "st:" + dot.dataset.step)
        : path([[A.cx, A.b], [A.cx, B.cy], [B.l, B.cy]], "tg:" + tg.dataset.persona, "st:" + dot.dataset.step);
    });
    /* шаг → карточки этапа, которые держат его экраны; экран Evidence — часть шага (для подсветки, без линии) */
    const docKey = sid => Object.keys(D.docs).find(k => D.docs[k].screen === sid);
    const urow = [...grid.querySelectorAll(".mc.l-user")], ub = Math.max(...urow.map(c => R(c).b));
    /* от шага — вниз до низа ряда User Actions, по нему к карточке; на пути чужая карточка — по краю колонки */

    };
    grid.querySelectorAll(".ua[data-step]").forEach(dot => {
      const st = STEPS.flat().find(x => x.id === dot.dataset.step), idx = cellOf(dot), A = R(dot.querySelector("i")), done = new Set();
      st.screens.forEach(sid => {
        edges.push(["ev:" + sid, "st:" + st.id]);

    /* путь персонажа: старт → шаги по порядку слева направо — по низу ряда User Actions (своя дорожка на персонажа), в шаг — слева; виден при наведении, без него порядок держат номера */

  /* цепочка узла: всё, что до него и после него по стрелкам */
  const nodeId = el => el.dataset.proc || (el.dataset.step ? "st:" + el.dataset.step : el.dataset.ev ? "ev:" + el.dataset.ev : el.classList.contains("uat") ? "tg:" + el.dataset.persona : "");
  function chain(id) {
    const E = JSON.parse(grid.dataset.edges || "[]"), on = new Set([id]);
    [[0, 1], [1, 0]].forEach(([f, t]) => { const q = [id]; while (q.length) { const x = q.shift(); E.forEach(e => { if (e[f] === x && !on.has(e[t])) { on.add(e[t]); q.push(e[t]) } }) } });
    return on;
  }
  grid.addEventListener("mouseover", e => {
    const el = body.dataset.view === "how" && e.target.closest(".hw[data-proc],.ua[data-step],.ev,.uat"); if (!el || grid.dataset.hot === nodeId(el)) return;
    const on = chain(nodeId(el)); grid.dataset.hot = nodeId(el); grid.classList.add("hot");
    grid.querySelectorAll(".hw[data-proc],.ua[data-step],.ev,.uat").forEach(x => x.classList.toggle("on", on.has(nodeId(x))));
    grid.querySelectorAll("svg.hwl .ln").forEach(x => x.classList.toggle("on", on.has(x.dataset.a) && on.has(x.dataset.b)));
  });
  grid.addEventListener("mouseleave", () => { grid.dataset.hot = ""; grid.classList.remove("hot") });
  grid.addEventListener("mouseout", e => { if (!e.relatedTarget || !e.relatedTarget.closest(".hw[data-proc],.ua[data-step],.ev,.uat")) { grid.dataset.hot = ""; grid.classList.remove("hot") } });
  window.addEventListener("load", drawLinks); window.addEventListener("resize", drawLinks);

  /* ---------- требования к экранам: документы «F3 · …» в backlog/docs/screens — вкладки и стек заметок ---------- */
  const IMG_MD = /^!\[(.*?)\]\((.+?)\)$/, SCR = {}, NOTE_OF = {};
  /* файл экрана: # заголовок, картинки до первой вкладки, ## вкладка, ### заметка, ниже — markdown */
  function parseNotes(text) {
    const doc = { title: "", images: [], tabs: [] }; let tab = null, note = null;
    text.split("\n").forEach(l => {
      let m;
      if (l.startsWith("### ")) { note = { title: l.slice(4).trim(), body: [] }; if (tab) tab.notes.push(note) }
      else if (l.startsWith("## ")) { tab = { name: l.slice(3).trim(), notes: [] }; doc.tabs.push(tab); note = null }
      else if (l.startsWith("# ")) doc.title = l.slice(2).trim();
      else if (note) note.body.push(l);
      else if (!tab && (m = l.trim().match(IMG_MD))) doc.images.push({ alt: m[1], src: m[2] });
    });
    doc.tabs.forEach(t => t.notes.forEach(n => n.md = n.body.join("\n").trim()));
    return doc;
  }
  const SCR_FILE = /assets\/screens\/([A-ZА-Я]\d{1,2})\.\w+$/;
  Object.keys(D.notes || {}).forEach(id => { SCR[id] = parseNotes(D.notes[id]); NOTE_OF[id] = id; SCR[id].images.forEach(im => { const m = im.src.match(SCR_FILE); if (m && !NOTE_OF[m[1]]) NOTE_OF[m[1]] = id }) });
  const imgSrc = s => fileURL(s);
  const mdInline = s => esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\[УТОЧНИТЬ у ([^\]]+)\]/g, '<mark>? $1</mark>');
  function mdHTML(text) {
    let k = -1;
    return text.split(/\n{2,}/).map(block => {
      const lines = block.split("\n"), im = block.trim().match(IMG_MD);
      if (im) { k++; return `<figure><img src="${esc(imgSrc(im[2]))}" alt="${esc(im[1])}" data-zoom="${k}"><figcaption>${esc(im[1])}</figcaption></figure>` }
      if (lines.every(l => /^\d+\.\s/.test(l))) return `<ol>${lines.map(l => `<li>${mdInline(l.replace(/^\d+\.\s+/, ""))}</li>`).join("")}</ol>`;
      if (lines.every(l => /^[-*] /.test(l))) return `<ul>${lines.map(l => `<li>${mdInline(l.slice(2))}</li>`).join("")}</ul>`;
      if (/^Источник:/.test(block)) return `<p class="snsrc">${mdInline(block)}</p>`;
      return `<p>${lines.map(mdInline).join("<br>")}</p>`;
    }).join("");
  }
  const notePreview = n => (n.md.split("\n").find(l => l.trim() && !IMG_MD.test(l.trim()) && !l.startsWith("Источник:")) || "").replace(/\*\*/g, "").replace(/\[УТОЧНИТЬ у ([^\]]+)\]/g, "? $1").replace(/^[-*] /, "");
  let snCur = null, snTab = 0, gallery = [];
  const snHead = (title, back) => head(title, "", back);
  function openScreen(id, tab) {
    snCur = NOTE_OF[id]; if (tab != null) snTab = tab; const d = SCR[snCur], t = d.tabs[snTab] || d.tabs[0];
    const sids = Object.keys(NOTE_OF).filter(s => NOTE_OF[s] === snCur); execPrep(sids);
    gallery = d.images.map(im => ({ alt: im.alt, src: imgSrc(im.src) }));
    side.innerHTML = snHead(d.title) + `<div class="snbody">${gallery.length ? `<div class="sngal${gallery.length > 1 ? " many" : ""}">${gallery.map((im, i) => `<img src="${esc(im.src)}" alt="${esc(im.alt)}" data-zoom="${i}">`).join("")}</div>` : ""}
      <nav class="snseg">${d.tabs.map((x, i) => `<button data-sntab="${i}"${x === t ? ' class="on"' : ""}>${esc(x.name)}</button>`).join("")}</nav>
      <ul class="snstack">${(t ? t.notes : []).map((n, i) => `<li data-snnote="${i}" tabindex="0"><b>${esc(n.title)}</b><span>${esc(notePreview(n))}</span>${n.md.includes(MARK) ? '<i class="q"></i>' : ""}</li>`).join("")}</ul>${execInline()}</div>`;
    body.classList.remove("wide"); body.classList.add("open"); side.scrollTop = 0;
    side.dataset.ctx = "screen:" + snCur; side.dataset.note = "";
    execShow(sids, "screen:" + snCur);
  }
  function openNote(i) {
    const d = SCR[snCur], n = d.tabs[snTab].notes[i];
    gallery = n.md.split(/\n{2,}/).map(b => b.trim().match(IMG_MD)).filter(Boolean).map(m => ({ alt: m[1], src: imgSrc(m[2]) }));
    side.innerHTML = snHead(n.title, true) + `<div class="snbody"><div class="snmd">${mdHTML(n.md)}</div></div>`; side.scrollTop = 0;
    side.dataset.ctx = "screen:" + snCur; side.dataset.note = `${d.tabs[snTab].name} · заметка «${n.title}»`;
  }
  /* просмотр картинки: крупно, ‹ › если их несколько; Esc или клик мимо — закрыть */
  const LB = document.getElementById("lb"); let lbI = 0;
  function zoom(i) {
    lbI = (i + gallery.length) % gallery.length; const im = gallery[lbI], many = gallery.length > 1;
    LB.innerHTML = `<figure><img src="${esc(im.src)}" alt="${esc(im.alt)}"><figcaption>${esc(im.alt)}${many ? ` · ${lbI + 1} из ${gallery.length}` : ""}</figcaption></figure>${many ? '<button class="nv p" data-lb="-1" aria-label="Предыдущая">‹</button><button class="nv n" data-lb="1" aria-label="Следующая">›</button>' : ""}<button class="lx" aria-label="Закрыть">×</button>`;
    LB.hidden = false;
  }

  /* ---------- первый экран: «Что видят» раскадровкой, путь уходит вправо ----------

  const hero = document.getElementById("hero");
  (function buildHero() {

    const sc = document.getElementById("hscroll"), prev = hero.querySelector(".prev"), next = hero.querySelector(".next");
    const sync = () => { prev.hidden = sc.scrollLeft < 8; next.hidden = sc.scrollLeft + sc.clientWidth > sc.scrollWidth - 8 };
    sc.addEventListener("scroll", sync, { passive: true }); window.addEventListener("resize", sync); sync();
    prev.addEventListener("click", () => sc.scrollBy({ left: -sc.clientWidth * .8, behavior: "smooth" }));

    const last = day(W, 4);
    gridRoad.innerHTML = `<div class="rmwrap"><div class="rmhead"><button class="rmback" data-view="see">← К карте</button><span class="arst">${esc(RM.status)}</span><h2>Roadmap</h2>
      <p>${W / SW} ${plural(W / SW, "спринт", "спринта", "спринтов")} по ${SW} ${plural(SW, "неделе", "недели", "недель")} · ${dm(day(1, 0))} — ${dm(last)}.${last.getFullYear()} · не больше ${RM.maxSprints} спринтов</p></div>
      <div class="rmscroll"><div class="rmboard">${h}</div></div>
      ${off.length ? `<div class="rmoff"><h4>Вне плана · ${off.length}</h4>${off.map(w => `<button class="ref" ${SUB[w.id] ? "data-sub" : "data-task"}="${esc(w.id)}" title="${esc(w.text)}">${esc(w.id)}</button>`).join(" ")}</div>` : ""}</div>`;
  }

  /* ---------- вкладка «Риски»: риски исполнения историй, согласуются с PO, на основной карте их нет ----------
     Данные — документ «Риски исполнения» (ключ risks.items) и кандидаты по данным карты (risks.auto):
     стык BE+FE, DevOps, интеграция систем. Сводка по типам, риски по историям со статусом согласования;
     кандидаты без строки в документе — блоком «Не записаны». */
  const RK = D.risks || null, gridRisk = document.getElementById("risk");
  const RK_KIND = { befe: ["Стык BE+FE", "в истории подзадачи BE и FE — детали реализации не собраны, бэкенд может не успеть отдать данные"], devops: ["DevOps", "в истории работы DevOps — CI/CD, сетевые доступы, загрузка команды"], integration: ["Интеграция систем", "история работает с внешней системой или заводит новый сервис — согласования и доступы"], other: ["Другое", ""] };
  const RK_ST = { "на согласовании": "wait", "согласован": "ok", "снят": "off" };
  function rkBoard() {
    if (!RK || !gridRisk) return;
    const items = RK.items, have = new Set(items.map(r => r.story + ":" + r.kind)), miss = RK.auto.filter(a => !have.has(a.story + ":" + a.kind));
    const kinds = Object.keys(RK_KIND).filter(k => items.some(r => r.kind === k) || miss.some(a => a.kind === k));
    const ok = items.filter(r => r.status === "согласован").length;
    const stories = [...new Set(items.map(r => r.story))].sort((a, b) => D.tasks.findIndex(t => t.id === a) - D.tasks.findIndex(t => t.id === b));
    const card = r => `<div class="rkcard ${RK_ST[r.status] || ""}"><div class="rktop"><span class="rkk">${esc(RK_KIND[r.kind][0])}</span><span class="rkid">${esc(r.id)}</span><span class="rkst ${RK_ST[r.status] || ""}">${esc(r.status)}</span></div>
      <p class="rktx">${mdInline(r.text)}</p><p class="rkm"><span>Митигация</span>${mdInline(r.mitigation)}</p><p class="rko">Владелец · ${esc(r.owner)}</p></div>`;
    gridRisk.innerHTML = `<div class="rkwrap"><div class="rmhead"><button class="rmback" data-view="see">← К карте</button>${RK.status ? `<span class="arst">${esc(RK.status)}</span>` : ""}<h2>Риски исполнения</h2>
      <p>Согласуются с PO инициативы · ${items.length} ${plural(items.length, "риск", "риска", "рисков")}, согласовано ${ok}${miss.length ? ` · не записано ${miss.length}` : ""}</p></div>
      <div class="rksum">${kinds.map(k => `<div class="rks"><b>${items.filter(r => r.kind === k).length + miss.filter(a => a.kind === k).length}</b><span>${esc(RK_KIND[k][0])}</span><small>${esc(RK_KIND[k][1])}</small></div>`).join("")}</div>
      ${stories.map(sid => { const t = TASK[sid] || { id: sid, text: sid };
        return `<section class="rkst-g"><button class="ui-head" data-task="${esc(sid)}"><span class="ui-chip">История</span><span class="ui-name">${esc(t.text)}</span><span class="ui-tags"><span class="ui-zone">${esc(sid)}</span></span></button>
          <div class="rkgrid">${items.filter(r => r.story === sid).map(card).join("")}</div></section>` }).join("")}
      ${miss.length ? `<section class="rkmiss"><h4>Не записаны — найдены по данным карты</h4>${miss.map(a => `<button class="rkm-i" data-task="${esc(a.story)}"><span class="rkk">${esc(RK_KIND[a.kind][0])}</span><b>${esc(a.story)}</b> ${esc((TASK[a.story] || {}).text || "")}<small>${esc(RK_KIND[a.kind][1])}</small></button>`).join("")}</section>` : ""}</div>`;
  }

  /* первый шаг дорожки — куда ведут её ворота */
  const rlStepOfTrack = tr => { const s = RL.steps.find(x => x.track === tr); return s ? s.id : (RL.steps[0] ? RL.steps[0].id : "") };


  /* ---------- три слоя: «Что видят», «Что делаем», «Как это работает» — переключатель, а не прокрутка страницы ----------
     «Что делаем» и «Как это работает» — одна сетка с общей строкой этапов, слой прячет чужие ряды.
     Четвёртый слой «Релиз» — доска дорожек DEV/STAGE/PROD, отдельная разметка (#rel). */
  const work = document.getElementById("work");
  function setView(v) {
    const was = body.dataset.view; if (was === v) return;
    const hs = document.getElementById("hscroll"), hh = [...hero.querySelectorAll(".hh")], mh = [...grid.querySelectorAll(".mh:not(.corner)")];
    const firstVisible = (els, box, pad) => Math.max(0, els.findIndex(el => el.getBoundingClientRect().right > box.getBoundingClientRect().left + pad + 24));
    body.dataset.view = v;
    document.querySelectorAll("button[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
    if (v === "rel") { if (RL) { rlBoard(); gridRel.scrollIntoView({ block: "start" }) } return }
    if (v === "adr") { if (AR || SR) { adrBoard(); adrGrid.scrollIntoView({ block: "start" }) } return }
    if (v === "road") { if (RM) { rmBoard(); gridRoad.scrollTop = 0 } return }
    if (v === "risk") { if (RK) { rkBoard(); gridRisk.scrollTop = 0 } return }
    if (was === "rel" || was === "adr" || was === "road" || was === "risk") { window.scrollTo(0, 0) }
    const col = was === "see" ? firstVisible(hh, hs, 132) : was === "rel" || was === "road" || was === "risk" ? 0 : firstVisible(mh, work, 96);
    if (v === "see") hs.scrollLeft = hh[col] ? hh[col].offsetLeft - 132 : 0;
    else { work.scrollTop = 0; work.scrollLeft = mh[col] ? mh[col].offsetLeft - 96 : 0 }
    drawLinks();
  }
  body.dataset.view = "see";

  /* ---------- телефон: шаг за шагом сверху вниз; план релиза и архитектура — секциями в начале стека ---------- */
  document.getElementById("mstack").innerHTML = (RL ? `<section class="ms rlms"><div class="mh2"><span class="n">↗</span><div><b>План релиза</b><small>DEV → STAGE → PROD, ворота переходов</small></div></div><div class="wl" id="mrel"></div></section>` : "") + ((AR || SR) ? `<section class="ms arsms"><div class="mh2"><span class="n">A</span><div><b>Архитектура</b><small>ADR и системные требования: как реализуем</small></div></div><div id="madr"></div></section>` : "") + COLS.map((col, c) => {
    const tasks = byPrio(D.tasks.filter(t => t.stage === col.id)), procs = D.cards.filter(p => p.stage === col.id);
    return `<section class="ms"><div class="mh2"><span class="n">${c === COLS.length - 1 ? "✓" : c + 1}</span><div><b>${esc(col.name)}</b>${col.when ? `<small>${esc(col.when)}</small>` : ""}</div></div>
      <div class="wl">${seenHTML(c)}</div>${tasks.some(t => !oos(t)) ? `<span class="lb">Что делаем</span><div class="wl">${tasks.filter(t => !oos(t)).map(taskHTML).join("")}</div>` : ""}${tasks.some(oos) ? `<span class="lb oosb">Out of scope · Would</span><div class="wl">${tasks.filter(oos).map(taskHTML).join("")}</div>` : ""}
      ${procs.length ? `<span class="lb">Как это работает</span><div class="wl">${procs.map(procHTML).join("")}</div>` : ""}</section>`;
  }).join("");
  /* телефон: план релиза — дорожки по очереди, карточки те же, ворота строкой */
  if (RL) {
    const mr = document.getElementById("mrel");
    if (mr) mr.innerHTML = RL.tracks.map(t => {
      const steps = RL.steps.filter(s => s.track === t.id), gate = RL.gates.find(g => g.frm === t.id);
      return `<span class="lb">${esc(t.title)}</span>` + (steps.map((s, i) => rlCard(s, 0, i)).join("") || '<p class="rlempty">Шагов нет</p>') +
        (gate ? `<div class="rlgate" style="margin:4px -14px 8px"><span class="rlgl">ВОРОТА → ${esc(TRACK_T[gate.to])}</span><span class="rlgw">${esc(gate.who)}</span><span class="rlgc">${esc(gate.criterion)}</span></div>` : "");
    }).join("");
  }
  /* телефон: архитектура — те же вкладки и таблицы, диаграмма текстом mermaid;
     рендер отложен до конца файла (arInit) — adrOpen/sysOpen и табличные хелперы
     объявлены ниже по файлу, при загрузке сразу их звать нельзя (TDZ) */
  function arInit() {
    if (!(AR || SR)) return;
    const mr = document.getElementById("madr");
    if (!mr) return;
    {
      arCur = "adr";
      mr.innerHTML = `<div class="arwrap"><div class="arnav">${AR ? `<button data-artab="adr" class="on">ADR</button>` : ""}${SR ? `<button data-artab="sys">Системные требования</button>` : ""}</div>${AR ? adrOpen(true) : ""}${SR ? sysOpen() : ""}</div>`;
      mr.querySelectorAll("[data-artab]").forEach(b => b.addEventListener("click", () => {
        arCur = b.dataset.artab;
        mr.querySelectorAll("[data-artab]").forEach(x => x.classList.toggle("on", x === b));
        mr.innerHTML = `<div class="arwrap"><div class="arnav">${AR ? `<button data-artab="adr"${arCur === "adr" ? ' class="on"' : ""}>ADR</button>` : ""}${SR ? `<button data-artab="sys"${arCur === "sys" ? ' class="on"' : ""}>Системные требования</button>` : ""}</div>${arCur === "adr" && AR ? adrOpen(true) : ""}${arCur === "sys" && SR ? sysOpen() : ""}</div>`;
      }));
    }
  }

  /* ---------- боковая панель ---------- */
  const side = document.getElementById("side");
  function openSide(tag, color, title, meta, html, wide) {
    side.dataset.ctx = ""; side.dataset.note = ""; execHide();
    side.innerHTML = `<div class="stop"><span class="tag" style="--c:${color}">${esc(tag)}</span><h3>${esc(title)}</h3><div class="meta">${meta}</div><button class="x" aria-label="Закрыть">×</button></div><div class="sin">${html}</div>`;
    body.classList.toggle("wide", !!wide); body.classList.add("open"); side.scrollTop = 0;
  }
  const closeSide = () => { body.classList.remove("open", "wide"); execHide() };

  function openSeen(key) {
    const s = D.seen.find(x => x.key === key), p = D.personas.find(x => x.id === s.persona), col = COLS[s.col];
    const html = s.steps.map(st => `<div class="stp">${st.screens.length ? `<div class="chips2">${[...new Set(st.screens.map(id => D.screens[id].contour))].map(chip).join("")}</div><div class="vis">${st.screens.map(id => mock(id, 170)).join("")}</div>` : ""}
      <h5>${esc(st.title)}</h5><p>${esc(st.text)}</p>${st.was ? `<div class="was"><b>Раньше</b>${esc(st.was)}</div>` : ""}
      ${qList(qsOf([st.id, ...st.screens]))}<div class="src">Источник: ${esc(st.source)}</div></div>`).join("");
    execPrep(s.steps.flatMap(st => st.screens));
    side.innerHTML = head(col.name, `<span class="pteam" style="--c:#2f6b2a"><i></i>${esc(p.name)}</span> · ${esc(p.lane)} · ${s.steps.length} ${plural(s.steps.length, "шаг", "шага", "шагов")}`) + `<div class="snbody">${html}${execInline()}</div>`;
    body.classList.remove("wide"); body.classList.add("open"); side.scrollTop = 0;
    side.dataset.ctx = "seen:" + key; side.dataset.note = "";
    execShow(s.steps.flatMap(st => st.screens), "seen:" + key);
  }

  /* ---------- «Исполнение»: вторая панель рядом с экраном — задачи «Что делаем», которые его делают ----------
     Связь — из проекта Backlog.md: documentation задачи или её карточки ссылается на документ экрана
     (строка «экраны: F3» плана, `./backlog.py task edit BP-16 --doc doc-12`). Задачи — по командам,
     клик открывает постановку, «←» возвращает к экрану. Узкий экран — тот же список внизу панели экрана. */
  const ex = document.getElementById("exec");
  const DOC_SCR = {}, SCR_DOC = {}, SCR_TASKS = {};
  Object.keys(D.docs).forEach(k => { const sid = D.docs[k].screen; if (sid) { DOC_SCR[k] = sid; SCR_DOC[sid] = SCR_DOC[sid] || k } });
  const docKey = x => String(x).toLowerCase().split(" ")[0];
  const linkScr = (doc, tid) => { const sid = DOC_SCR[docKey(doc)]; if (!sid || !TASK[tid]) return; const l = SCR_TASKS[sid] = SCR_TASKS[sid] || []; if (!l.includes(tid)) l.push(tid) };
  D.tasks.forEach(t => t.docs.forEach(d => linkScr(d, t.id)));
  D.cards.forEach(c => c.docs.forEach(d => linkScr(d, c.task)));
  let exFrom = "", exIds = [], exScr = [];
  function execPrep(sids) {
    exScr = [...new Set(sids)];
    exIds = [...new Set(exScr.flatMap(s => SCR_TASKS[s] || []))].sort((a, b) => colOf(TASK[a].stage) - colOf(TASK[b].stage));
  }
  function execList(cur) {
    const groups = [...D.teams.map(t => t.id), "?"].map(tm => [tm, exIds.filter(id => (TASK[id].team in TEAM ? TASK[id].team : "?") === tm)]).filter(g => g[1].length);
    const item = id => { const t = TASK[id], b = blocks(id).length;
      return `<li data-extask="${esc(id)}" tabindex="0"${id === cur ? ' class="on"' : ""}><b>${esc(t.text)}</b><span>${esc(id)} · ${esc(t.status)}</span>${b ? '<i class="q" title="Блокер"></i>' : ""}</li>` };
    const empty = `<p class="exno">Задач для экрана нет. Свяжите задачу с ним строкой «экраны: ${esc(exScr.join(", "))}» в плане.</p>`;
    return groups.length ? groups.map(([tm, ids]) => { const t = TASK[ids[0]];
      return `<section class="exg"><h4 style="--c:${teamC(t)}"><i></i>${esc(tm === "?" ? "Команда не определена" : teamN(t))}</h4><ul class="snstack exl">${ids.map(item).join("")}</ul></section>` }).join("") : empty;
  }
  const execInline = () => exScr.length ? `<div class="exin"><h4 class="exh">Исполнение · ${exIds.length}</h4>${execList("")}</div>` : "";
  function execShow(sids, from, cur) {
    if (from) { execPrep(sids); exFrom = from }
    if (!exScr.length) return execHide();
    body.classList.remove("how"); ex.dataset.task = "";
    ex.innerHTML = `<div class="snbar"><h3>Исполнение</h3><span class="excnt">${nTasks(exIds.length)}</span></div><div class="snbody">${execList(cur || "")}</div>`;
    body.classList.add("side2");
  }
  function execHide() { body.classList.remove("side2", "how"); exFrom = ""; ex.dataset.task = "" }
  /* «←»: из подзадачи и карточки «Как это работает» — к истории, из постановки — к экрану или этапу, откуда её открыли, иначе — к экрану */
  function goBack() {
    const [kind, id] = (side.dataset.ctx || ":").split(":");
    if (kind === "sub") return openTask(SUB[id].task, 0);
    if (kind === "proc" && TASK[PROC[id].task]) return openTask(PROC[id].task, 0);
    return kind === "task" && exFrom ? execBack() : openScreen(snCur);
  }
  /* назад из постановки — к экрану или этапу, откуда её открыли */
  function execBack() {
    const [kind, id] = exFrom.split(/:(.*)/);
    return kind === "seen" ? openSeen(id) : openScreen(kind === "screen" ? id : snCur);
  }
  /* ---------- HowToDemo: шаги списком, под ними — раскадровка, раскрывается вниз: картинка и краткое название ----------
     Экраны — те, на которые ведёт documentation задачи или карточки. Экран шага: ID в тексте шага «(F3)»,
     иначе экран, чьё название ближе к тексту шага, иначе экран прошлого шага. «Делаю — вижу» делит
     первое «→» или «—». Шаги не списком или экранов нет — HowToDemo текстом, как раньше. */
  const scrName = sid => SCR_DOC[sid] ? D.docs[SCR_DOC[sid]].title.replace(/^[^·]*·\s*/, "") : sid;
  const stems = x => new Set((String(x).toLowerCase().match(/[a-zа-яё0-9]{4,}/g) || []).map(w => w.slice(0, 5)));
  const SID_RE = /\s*\(([A-ZА-Я]\d{1,2}(?:\s*,\s*[A-ZА-Я]\d{1,2})*)\)/g;
  function demoHTML(md, docs) {
    const lines = String(md || "").trim().split("\n").filter(l => l.trim());
    const sids = [...new Set(docs.map(d => DOC_SCR[docKey(d)]).filter(Boolean))];
    if (!lines.length || !sids.length || !lines.every(l => /^\d+\.\s/.test(l))) return mdHTML(md || "");
    let prev = "";
    const steps = lines.map(l => {
      let text = l.replace(/^\d+\.\s+/, ""), sid = "";
      text = text.replace(SID_RE, (m, ids) => { sid = sid || ids.split(/\s*,\s*/).find(x => D.screens[x]) || ""; return sid ? "" : m });
      if (!sid) {
        const w = stems(text); let best = 0;
        sids.forEach(x => { const n = [...stems(scrName(x))].filter(y => w.has(y)).length; if (n > best || (n === best && n && x === prev)) { best = n; sid = x } });
      }
      sid = sid || prev || sids[0]; prev = sid;
      const m = text.match(/^(.+?)\s+[→—]\s+(.+)$/);
      return { sid, text, act: m ? m[1] : text, see: m ? m[2] : "" };
    });
    gallery = steps.map((st, i) => ({ alt: `Шаг ${i + 1} · ${st.sid} · ${scrName(st.sid)}`, src: screenImg(st.sid) }));
    return `<ol>${steps.map(st => `<li>${mdInline(st.text)}</li>`).join("")}</ol><details class="dmd"><summary>Раскадровка · ${steps.length} ${plural(steps.length, "шаг", "шага", "шагов")}</summary><ol class="demo">${steps.map((st, i) => `<li class="dm">
      <span class="dmpic"><img src="${esc(screenImg(st.sid))}" alt="${esc(scrName(st.sid))}" data-zoom="${i}" loading="lazy" draggable="false"></span>
      <span class="dmx"><b><span class="dmn">${i + 1}</span>${mdInline(st.act)}</b><small>${esc(st.sid)} · ${esc(scrName(st.sid))}</small></span></li>`).join("")}</ol></details>`;
  }
  /* ---------- «Как это работает» задачи: вторая панель слева от постановки ----------
     Карточка-превью: JobStory заголовком (нет — название карточки), под ней схема процесса (mermaid),
     панель листается. Клик — карточка целиком. Пришли из «Исполнения» экрана — слева остаётся оно. */
  function howShow(id) {
    const cards = D.cards.filter(c => c.task === id);
    if (!cards.length) return execHide();
    if (ex.dataset.task === id && body.classList.contains("how")) return;
    ex.dataset.task = id;
    ex.innerHTML = `<div class="snbar"><h3>Как это работает</h3><span class="excnt">${cards.length} ${plural(cards.length, "карточка", "карточки", "карточек")}</span></div><div class="snbody">${cards.map(c => { const L = LAYER[c.layer];
      return `<section class="hwc" data-proc="${esc(c.id)}" tabindex="0"><span class="hwm"><span class="lay" style="--c:${L[2]}">${L[0]}</span> · ${esc(c.id)}</span>
        <b>${mdInline((c.js || [])[0] || c.us || c.text)}</b>
        ${c.bpmn ? `<div class="bpmnw"><pre>${esc(c.bpmn)}</pre></div>` : ""}</section>` }).join("")}</div>`;
    body.classList.add("side2", "how"); ex.scrollTop = 0;
    ex.querySelectorAll(".bpmnw").forEach(drawMermaid);
  }
  /* подзадача истории по зоне: что сделать, исполнитель, критерии приемки; «←» — к истории */
  function openSub(id) {
    const z = SUB[id], t = TASK[z.task];
    const ac = z.ac.length ? `<ul class="zac">${z.ac.map(([, x]) => `<li>${mdInline(x)}</li>`).join("")}</ul>` : "";
    const brief = (ZONE_SECS[z.zone] || []).map(k => sec(k, mdHTML((z.brief || {})[k] || ""))).join("");
    const reqs = t && t.reqs.length ? `<p class="zreq"><span class="lk">Требования БФТ</span> ${t.reqs.map(esc).join(", ")}</p>` : "";
    side.innerHTML = head(z.text, `<b class="zt" style="--c:${teamC(z)}">${esc(z.zone)}</b> <span class="pteam" style="--c:${teamC(z)}"><i></i>${esc(z.team === "?" && z.cand ? "Команда? " + z.cand : teamN(z))}</span> · ${esc(id)} · ${esc(z.status)}`, true) + `<div class="snbody">
      ${z.lead ? `<p class="tklead">${mdInline(z.lead)}</p>` : ""}${brief}${sec(ZONE_CHECK[z.zone] || "Критерии приемки", ac)}${sec("Требования истории", t ? refList([`${idChip(t.id)} ${esc(t.text)}`]) + reqs : "")}${sec("Вопросы", qList(qsOf([id])))}</div>`;
    body.classList.remove("wide"); body.classList.add("open"); side.scrollTop = 0;
    side.dataset.ctx = "sub:" + id; side.dataset.note = "";
  }
  function execOpen(id) {

  /* задача «Что делаем» — постановка для техлида, задача Backlog.md. «Требования»: зачем, ASIS, GAP, TOBE,

  const dodKey = id => `bp-dod-${D.epic}-${id}`;

  const execKey = id => `bp-exec-${D.epic}-${id}`;
  const isJira = u => /jira|\/browse\/[A-Z][A-Z0-9]+-\d+/i.test(u), isConf = u => !isJira(u) && /confluence|wiki|\/pages\//i.test(u);
  function execOf(t) {
    let v = null; try { v = JSON.parse(localStorage.getItem(execKey(t.id)) || "null") } catch (e) { }

    const urls = t.refs.filter(u => /^https?:\/\//.test(u));

  const links = s => (s || "").split(/[\s,]+/).filter(u => /^https?:\/\//.test(u)).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, "").slice(0, 48))}</a>`).join("");

  /* команда CLI Backlog.md: ссылки JIRA и Confluence заменяют прежние такие же, остальные references остаются */
  const sh = x => `'${String(x).replace(/'/g, "'\\''")}'`;
  function execCmd(id) {
    const t = TASK[id], v = execOf(t), split = s => (s || "").split(/[\s,]+/).filter(Boolean);

      d[k] = c.checked; try { localStorage.setItem(dodKey(id), JSON.stringify(d)) } catch (er) { }

  const sec = (name, html) => html ? `<section class="tk"><h4>${name}</h4>${html}</section>` : "";
  /* вопросы карточки и задачи — те же, что в «Уточнить»: клик — ответить */
  const qList = qs => qs.length ? `<ul class="tkq">${qs.map(q => { const st = qState(q);
    return `<li class="${q.kind === "блокер" ? "b " : ""}${st}" data-q="${esc(q.key)}" tabindex="0">${st === "done" || st === "past" ? '<i class="ok">✓</i>' : '<i class="qd"></i>'}<span>${q.kind === "блокер" ? "<b>Блокер.</b> " : ""}${esc(q.text)} <em>— ${esc(q.to)}</em></span></li>` }).join("")}</ul>` : "";
  /* ссылка на другую задачу или карточку, документ, страницу */
  const idChip = id => SUB[id] ? `<button class="ref" data-sub="${id}" title="${esc(SUB[id].text)}">${esc(id)}</button>` : PROC[id] ? `<button class="ref" data-proc="${id}" title="${esc(PROC[id].text)}">${esc(id)}</button>` : TASK[id] ? `<button class="ref" data-task="${id}" title="${esc(TASK[id].text)}">${esc(id)}</button>` : `<code>${esc(id)}</code>`;
  function refItem(r) {

  /* шапка панели: заголовок, «!» — файлы проекта, откуда всё это, крестик; ниже — одна строка сведений */
  const head = (title, meta, back) => `<div class="snbar">${back ? '<button class="snback" data-snback aria-label="Назад">←</button>' : ""}<h3 title="${esc(title)}">${esc(title)}</h3><button class="srcb" data-src aria-label="Откуда это: файлы проекта" title="Откуда это: файлы проекта">!</button><button class="x" aria-label="Закрыть">×</button></div>${meta ? `<div class="tkmeta">${meta}</div>` : ""}`;

    const html = (t.why ? `<p class="tklead">${mdInline(t.why)}</p>` : "") + sec(`Подзадачи по зонам · ${subs.length}`, subs.length ? `<ul class="zl">${subs.map(z => `<li data-sub="${esc(z.id)}" tabindex="0"><b class="zt" style="--c:${teamC(z)}">${esc(z.zone)}</b><span>${esc(z.text)}<small>${esc(z.team === "?" && z.cand ? "Команда? " + z.cand : teamN(z))} · ${esc(z.id)} · ${esc(z.status)}</small></span></li>`).join("")}</ul>` : "") + sec("ASIS", mdHTML(br.ASIS || "")) + sec("GAP", mdHTML(br.GAP || "")) + sec("TOBE", mdHTML(br.TOBE || "")) +
      sec("HowToDemo", demoHTML(br.HowToDemo, [...t.docs, ...cards.flatMap(c => c.docs)])) + sec("Чеклист приемки", ac) + sec("Дополнительно", mdHTML(br["Дополнительно"] || "")) +
      sec("Как это работает", refList(cards.map(c => `${idChip(c.id)} ${esc(c.text)}`))) + sec("Вопросы", qList(qsOf([id, ...cards.map(c => c.id)]))) + sec("Ссылки", links);
    const tabs = `<nav class="snseg tktabs">${["Требования", "Исполнение"].map((n, i) => `<button data-tktab="${i}"${i === taskTab ? ' class="on"' : ""}>${n}</button>`).join("")}</nav>`;
    side.innerHTML = head(t.text, `<span class="pteam" style="--c:${teamC(t)}"><i></i>${esc(t.team === "?" && t.cand ? "Команда? " + t.cand : teamN(t))}</span>${leadOf(t) ? " · техлид " + esc(leadOf(t)) : ""}${t.prio ? ` · <span class="pr ${t.prio}">${PRIO[t.prio]}${oos(t) ? " · Out of scope" : ""}</span>` : ""} · ${esc(COLS[colOf(t.stage)].name)} · ${esc(id)} · ${esc(t.status)}`, back) + `<div class="snbody">${tabs}${taskTab ? execHTML(t) : html}</div>`;

  /* карточка «Как это работает» — техническая задача: UserStory, JobStory, процесс и его схема BPMN,

     из папки проекта (.blueprint/vendor), без сети. Нет mermaid — видно сам текст схемы. */
  const PNAME = { in: "Вход", ctl: "Управление", out: "Выход", mech: "Механизм" };
  let MM = null, mmN = 0;
  function mermaidLib() {
    if (window.mermaid) return Promise.resolve(window.mermaid);
    return MM || (MM = new Promise((ok, no) => {
      const sc = document.createElement("script"); sc.src = fileURL(D.mermaid || ""); sc.onerror = () => { MM = null; no(new Error("mermaid")) };
      sc.onload = () => { window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral", fontFamily: "Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif", themeVariables: { fontSize: "12.5px" }, flowchart: { useMaxWidth: true, htmlLabels: true, padding: 6, nodeSpacing: 28, rankSpacing: 34, wrappingWidth: 140 } }); ok(window.mermaid) };
      document.head.appendChild(sc);
    }));
  }
