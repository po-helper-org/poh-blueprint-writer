# Прототип «dineclub-restart: Перезапуск акции DineClub — «билет Acme Tickets = скидка 10%»» — собран ./blueprint.py prototype build, руками не правь
services:
  api:
    image: python:3.12-slim
    working_dir: /api
    volumes: ["./api:/api:ro"]
    command: sh -c "pip install --quiet --no-cache-dir fastapi==0.115.6 uvicorn==0.34.0 && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    image: python:3.12-slim
    working_dir: /web
    volumes: ["./web:/web:ro"]
    command: python -m http.server 8080
    ports: ["8080:8080"]
    depends_on: [api]
